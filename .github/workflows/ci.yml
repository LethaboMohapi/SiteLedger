name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.419
      - run: dotnet restore SiteLedger.sln
      - run: dotnet build SiteLedger.sln --no-restore --configuration Release --warnaserror
      - run: dotnet test src/SiteLedger.Tests/SiteLedger.Tests.csproj --no-build --no-restore --configuration Release
